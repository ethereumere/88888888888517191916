<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KaiserSec</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, Helvetica, sans-serif;
    }

    body{
      background:black;
      overflow:hidden;
      color:white;
    }

    /* PAGE ENTER */

    #enter-screen{
      position:fixed;
      width:100%;
      height:100vh;
      background:black;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      z-index:999;
      cursor:pointer;
      transition:1s;
    }

    #enter-screen h1{
      font-size:3rem;
      letter-spacing:3px;
      margin-bottom:20px;
      text-shadow:0 0 20px white;
    }

    #enter-screen p{
      font-size:1.2rem;
      opacity:0.7;
    }

    /* MAIN */

    #main{
      width:100%;
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      flex-direction:column;
      opacity:0;
      transition:1s;
    }

    #main img{
      width:420px;
      max-width:85%;
      border-radius:15px;
      box-shadow:0 0 40px rgba(255,255,255,0.2);
      margin-bottom:35px;
    }

    .links{
      text-align:center;
    }

    .links a{
      display:block;
      color:white;
      text-decoration:none;
      margin:12px 0;
      font-size:1.2rem;
      transition:0.3s;
    }

    .links a:hover{
      color:#999;
      transform:scale(1.05);
    }

    /* MUSIC PLAYER */

    .music-player{
      position:fixed;
      bottom:20px;
      left:50%;
      transform:translateX(-50%);
      background:rgba(255,255,255,0.05);
      padding:12px 20px;
      border-radius:12px;
      backdrop-filter:blur(5px);
    }

    input[type=range]{
      width:200px;
    }

    @media(max-width:600px){
      #enter-screen h1{
        font-size:2rem;
        text-align:center;
      }

      #main img{
        width:300px;
      }
    }
  </style>
</head>
<body>

  <!-- ENTER SCREEN -->

  <div id="enter-screen">
    <h1>KaiserSec Official WebSite</h1>
    <p>Click To Enter</p>
  </div>

  <!-- MAIN CONTENT -->

  <div id="main">

    <img src="3039F1EC-4BC9-4208-ADC4-A54A69AE8566.jpeg" alt="KaiserSec">

    <div class="links">
      <a href="mailto:57@kaisersec.online">
        Email
      </a>

      <a href="https://t.me/kaisersec" target="_blank">
        Telegram
      </a>

      <a href="https://www.tiktok.com/@kaisersec" target="_blank">
        TikTok
      </a>
    </div>

  </div>

  <!-- MUSIC -->

  <div class="music-player">
    <audio id="bgmusic" loop>
      <source src="wallahjsp.mp3" type="audio/mp3">
    </audio>

    <input type="range" id="volume" min="0" max="1" step="0.01" value="0.5">
  </div>

  <script>
    const enterScreen = document.getElementById("enter-screen");
    const main = document.getElementById("main");
    const music = document.getElementById("bgmusic");
    const volumeSlider = document.getElementById("volume");

    volumeSlider.addEventListener("input", () => {
      music.volume = volumeSlider.value;
    });

    music.volume = 0.5;

    enterScreen.addEventListener("click", () => {
      enterScreen.style.opacity = "0";

      setTimeout(() => {
        enterScreen.style.display = "none";
        main.style.opacity = "1";
      }, 1000);

      music.play();
    });
  </script>

</body>
</html>
